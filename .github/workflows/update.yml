name: Update Portfolio

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: pip install requests
      
      - run: python holdings.py
      
      - run: |
          git config user.name "ETK2456"
          git config user.email "ETK2456@users.noreply.github.com"
          git add README.md history.json
          git diff --staged --quiet || git commit -m "auto update"
          git push
